<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>2_类式组件</title>
  </head>
  <body>
    <!-- 准备好一个“容器” -->
    <div id="test"></div>

    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom，用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel，用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>

    <script type="text/babel">
      //1.创建类式组件
      class Weather extends React.Component {

        // 构造器调用了几次？ ------ 1次
        constructor(props) {
          super(props);
          // 初始化状态(state :react 三大组件之一)
          this.state = { isHot: false, wind: "AAAA" };
          //**** 解决changeWeather中this指向问题
          this.changeWeather = this.changeWeather.bind(this);
        }

        // render调用几次？ ------ 1+n次 1是初始化的那次 n是状态更新的次数
        render() {
          //render是放在哪里的？—— Weather的原型对象上，供实例使用。
          console.log(this);
          // 读取状态
          const { isHot } = this.state;
          return (
            <h1 onClick={this.changeWeather}>
              今天天气很{isHot ? "炎热" : "凉爽"}
            </h1>
          );
        }

        // changeWeather调用几次？ ------ n次 点几次调用几次
        changeWeather() {
          // changeWeather放在那里？======放在weather的原型对象上,供weather实例使用
          // 由于changeWeather是作为onClick的回调，所以<不是通过实例>调用的，是直接调用，再加上类中的方法默认开启了局部的严格模式，所以changeWeather中的this为undefined
          console.log("标题被点击了");
          console.log(this);
          // ！！！注意：状态(state)不可直接更改，要借助一个内置的api去更改。 this.state.isHot = !isHot
          // 正确更新 state
          this.setState((state) => ({
            isHot: !state.isHot,
          }));
        }
      }
      //2.渲染组件到页面
      ReactDOM.render(<Weather />, document.getElementById("test"));

      // const w = new Weather();
      // w.changeWeather();
      /* 
			执行了ReactDOM.render(<Weather/>.......之后，发生了什么？
					1.React解析组件标签，找到了Weather组件。
					2.发现组件是使用类定义的，随后new出来该类的实例，并通过该实例调用到原型上的render方法。
					3.将render返回的虚拟DOM转为真实DOM，随后呈现在页面中。
		*/
      // const title = document.getElementById('title');
      // // title.addEventListener('click',()=>{
      // // 	console.log("标题被点击");

      // // })
      // title.onclick = ()=>{
      // 	console.log("标题被点击");
      // }
    </script>
  </body>
</html>
