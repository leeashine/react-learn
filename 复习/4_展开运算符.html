<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        let arr = [1,3,4,5,9]
        let arr2 = [2,4,6,8]
        // 展开一个数组
        console.log(...arr)
        // 数组拼接
        let arr3 = [...arr,...arr2]
        console.log(arr3);
        
        // 不固定参数
        function sum(...numbers){
            return numbers.reduce((pre,cur)=>{
                return pre+cur;
            })
        }
        console.log(sum(1,2,3,4,5,6,7,8));

        // 构造字面量对象时使用展开语法
        let person ={name:'tom',age:18}
        // 复制/克隆对象 es9规范的对象扩展符
        let person2 = {...person}
        // 报错，展开运算符不能展开对象
        // console.log(...person); 
        console.log(person2.name);
        
        

        
    </script>
</body>
</html>
