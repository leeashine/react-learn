<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 准备好一个“容器” -->
    <div id="test"></div>
    <div id="test2"></div>
    <div id="test3"></div>

    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom，用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel，用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>

    <!-- 引入prop=types，用于对组建标签属性进行限制 -->
    <script type="text/javascript" src="../js/prop-types.js"></script>

    <script type="text/babel">
      /* 此处一定要写babel */
      // 创建组件
      class Person extends React.Component {
        // 对标签属性进行类型、必要性的限制
        static propTypes = {
          name: PropTypes.string.isRequired,
          sex: PropTypes.string,
        };

        // 制定默认标签属性值
        static defaultProps = {
          sex: "未知",
        };

        render() {
          // props是只读的
          const { name, age, sex } = this.props;
          // this.props.name='skxm' 注意此行会报错。因为props是只读的
          return (
            <ul>
              <li>姓名：{name}</li>
              <li>性别：{sex}</li>
              <li>年龄：{age + 1}</li>
            </ul>
          );
        }
      }

      //2.渲染虚拟DOM到页面
      const p = { name: "tome", age: 18, sex: "女" };
      const p2 = { name: "jack", age: 20, sex: "男" };

      // console.log(...p);

      ReactDOM.render(<Person {...p} />, document.getElementById("test"));
      ReactDOM.render(<Person {...p2} />, document.getElementById("test2"));

      ReactDOM.render(
        <Person name="jerry" age={19} />,
        document.getElementById("test3")
      );
    </script>
  </body>
</html>
