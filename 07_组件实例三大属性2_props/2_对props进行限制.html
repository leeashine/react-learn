<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 准备好一个“容器” -->
    <div id="test"></div>
    <div id="test2"></div>
    <div id="test3"></div>

    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!-- 引入react-dom，用于支持react操作DOM -->
    <script type="text/javascript" src="../js/react-dom.development.js"></script>
    <!-- 引入babel，用于将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>

    <!-- 引入prop=types，用于对组建标签属性进行限制 -->
    <script type="text/javascript" src="../js/prop-types.js"></script>


    <script type="text/babel"> /* 此处一定要写babel */
        // 创建组件
        class Person extends React.Component {
            
            render(){
                // props是只读的
                const {name,age,sex} = this.props;
                // this.props.name='skxm' 注意此行会报错。因为props是只读的
                return(
                    <ul>
                        <li>姓名：{name}</li>
                        <li>性别：{sex}</li>
                        <li>年龄：{age+1}</li>
                    </ul>
                )
            }
        }
        // 设置属性类型 16弃用
        Person.propTypes = {
            name:PropTypes.string.isRequired,
            sex:PropTypes.string
        }

        Person.defaultProps = {
            sex:'未知'
        }
        
        //2.渲染虚拟DOM到页面
        const p = {name:'tome',age:18,sex:'女'}
        const p2 = {name:'jack',age:20,sex:'男'}


        // 不能随意使用
        console.log(...p);

        // react支持展开对象
        ReactDOM.render(<Person {...p}/>, document.getElementById('test'));
        ReactDOM.render(<Person {...p2}/>, document.getElementById('test2'))

        // 类型限制 默认值 必填校验？？？
        ReactDOM.render(<Person name='jerry' age={19} />, document.getElementById('test3'))


    </script> 
    
</body>
</html>
